<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Cat body -->
  <ellipse cx="100" cy="130" rx="45" ry="35" fill="#FFB366" stroke="#FF8C42" stroke-width="2"/>

  <!-- Cat head -->
  <circle cx="100" cy="80" r="40" fill="#FFB366" stroke="#FF8C42" stroke-width="2"/>

  <!-- Cat ears -->
  <polygon points="75,50 85,25 95,50" fill="#FFB366" stroke="#FF8C42" stroke-width="2"/>
  <polygon points="105,50 115,25 125,50" fill="#FFB366" stroke="#FF8C42" stroke-width="2"/>

  <!-- Inner ears -->
  <polygon points="78,45 85,32 92,45" fill="#FF69B4"/>
  <polygon points="108,45 115,32 122,45" fill="#FF69B4"/>

  <!-- Cat eyes -->
  <ellipse cx="88" cy="75" rx="8" ry="12" fill="#000"/>
  <ellipse cx="112" cy="75" rx="8" ry="12" fill="#000"/>

  <!-- Eye shine -->
  <ellipse cx="90" cy="72" rx="3" ry="4" fill="#FFF"/>
  <ellipse cx="114" cy="72" rx="3" ry="4" fill="#FFF"/>

  <!-- Cat nose -->
  <polygon points="100,85 95,90 105,90" fill="#FF1493"/>

  <!-- Cat mouth -->
  <path d="M 100 92 Q 95 98 90 95" stroke="#000" stroke-width="2" fill="none"/>
  <path d="M 100 92 Q 105 98 110 95" stroke="#000" stroke-width="2" fill="none"/>

  <!-- Cat whiskers -->
  <line x1="60" y1="78" x2="80" y2="75" stroke="#000" stroke-width="2"/>
  <line x1="60" y1="85" x2="80" y2="85" stroke="#000" stroke-width="2"/>
  <line x1="60" y1="92" x2="80" y2="95" stroke="#000" stroke-width="2"/>

  <line x1="120" y1="75" x2="140" y2="78" stroke="#000" stroke-width="2"/>
  <line x1="120" y1="85" x2="140" y2="85" stroke="#000" stroke-width="2"/>
  <line x1="120" y1="95" x2="140" y2="92" stroke="#000" stroke-width="2"/>

  <!-- Cat legs -->
  <ellipse cx="80" cy="160" rx="8" ry="15" fill="#FFB366" stroke="#FF8C42" stroke-width="2"/>
  <ellipse cx="120" cy="160" rx="8" ry="15" fill="#FFB366" stroke="#FF8C42" stroke-width="2"/>

  <!-- Cat paws -->
  <circle cx="80" cy="175" r="6" fill="#FF8C42"/>
  <circle cx="120" cy="175" r="6" fill="#FF8C42"/>

  <!-- Cat tail -->
  <path d="M 140 120 Q 160 100 170 130 Q 165 150 150 140" fill="#FFB366" stroke="#FF8C42" stroke-width="2"/>

  <!-- Cat stripes on head -->
  <path d="M 85 60 Q 100 55 115 60" stroke="#FF8C42" stroke-width="3" fill="none"/>
  <path d="M 82 68 Q 100 63 118 68" stroke="#FF8C42" stroke-width="3" fill="none"/>

  <!-- Cat stripes on body -->
  <path d="M 70 115 Q 100 110 130 115" stroke="#FF8C42" stroke-width="3" fill="none"/>
  <path d="M 75 125 Q 100 120 125 125" stroke="#FF8C42" stroke-width="3" fill="none"/>
  <path d="M 80 135 Q 100 130 120 135" stroke="#FF8C42" stroke-width="3" fill="none"/>
</svg>